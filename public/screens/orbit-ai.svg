le</text><rect x="640" y="410" width="510" height="64" rx="16" fill="#5CE1E6" fill-opacity=".16" stroke="#5CE1E6" stroke-opacity=".6"/><text x="664" y="448" fill="#E8EEFF" font-size="17">Share the Linear Algebra unit 2 notes</text><rect x="250" y="506" width="640" height="104" rx="16" fill="#0E1A3D" stroke="#223260"/><text x="274" y="542" fill="#E8EEFF" font-size="17">Found one file: Linear Algebra – Unit 2 notes (PDF)</text><text x="274" y="570" fill="#8A98C0" font-size="15">Uploaded by Dr. Reena Joshi</text><rect x="250" y="640" width="900" height="52" rx="26" fill="#0E1A3D" stroke="#223260"/><text x="278" y="672" fill="#8A98C0" font-size="16">Ask ORBIT anything about your section…</text></svg>